<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">授权发明专利</title>
  <desc id="desc">南昌大学拥有的一项多模态数据行为分析发明专利，专利号 ZL 2026 1 0014230.6。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#173f5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#38d9a9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ecae6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#background)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="26.5" fill="none" stroke="url(#accent)" stroke-opacity="0.48" stroke-width="3"/>

  <g transform="translate(64 58)">
    <rect width="150" height="178" rx="18" fill="#f8fafc" fill-opacity="0.96" stroke="#fbbf24" stroke-width="4"/>
    <path d="M34 42H116M34 70H102M34 98H89" stroke="#173f5f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="111" cy="132" r="28" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M97 153L90 190L111 177L132 190L125 153" fill="#f59e0b"/>
    <path d="M111 114L117 126L131 128L121 138L124 152L111 145L98 152L101 138L91 128L105 126Z" fill="#fff7d6"/>
  </g>

  <g transform="translate(260 54)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="0" y="24" fill="#7ff3d0" font-size="18" font-weight="700" letter-spacing="2.2">AUTHORIZED INVENTION PATENT</text>
    <text x="0" y="76" fill="#f8fafc" font-size="29" font-weight="720">一种基于多模态数据的行为分析方法、系统、</text>
    <text x="0" y="116" fill="#f8fafc" font-size="29" font-weight="720">设备及介质</text>
    <text x="0" y="160" fill="#a9c5da" font-size="20">ZL 2026 1 0014230.6</text>
    <circle cx="250" cy="154" r="3" fill="#fbbf24"/>
    <text x="268" y="160" fill="#a9c5da" font-size="20">专利权人：南昌大学</text>
    <circle cx="515" cy="154" r="3" fill="#fbbf24"/>
    <text x="533" y="160" fill="#a9c5da" font-size="20">授权公告日：2026-03-31</text>

    <g transform="translate(0 188)">
      <rect width="186" height="46" rx="23" fill="#123c4a" stroke="#38d9a9" stroke-opacity="0.65"/>
      <text x="93" y="30" text-anchor="middle" fill="#7ff3d0" font-size="17" font-weight="650">查看证书 PDF  →</text>
    </g>
  </g>
</svg>
